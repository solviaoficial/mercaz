# Troque mercaz.seudominio.com pelo seu domínio.
# Depois de apontar o DNS, use Certbot ou seu proxy para adicionar HTTPS.
server {
    listen 80;
    server_name mercaz.seudominio.com;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Este exemplo supõe apenas UM proxy diretamente na frente da aplicação.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
